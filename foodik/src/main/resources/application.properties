spring.application.name=foodik

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodik}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mini}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=${SERVER_PORT:8081}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT
application.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.jwt.expiration=${JWT_EXPIRATION:86400000}
application.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Reservations
application.reservation.confirmation-timeout-minutes=${RESERVATION_TIMEOUT:15}

# Scraping
application.scraping.timeout-ms=15000

# Logging â€” debug scraping en desarrollo
logging.level.co.edu.unbosque.foodik.integration=DEBUG

# Foursquare Places API v3 ? obtener en: https://foursquare.com/developers
# 1.000 requests/día gratis. Pegar la API key aquí o en variable de entorno.
application.scraping.foursquare-api-key=
hola=
# OBLIGATORIO: User-Agent real de navegador (evita bloqueo Overpass)
application.scraping.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36


